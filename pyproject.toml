[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apholo8-egnn"
version = "0.1.0"
description = "apholo8-EGNN binding-site predictor, inference only"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "torch==2.11.*",
    "torch-geometric>=2.8",
    "pyg-lib>=0.6.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "safetensors>=0.4.0",
    "fair-esm>=2.0.0",
    "biopython>=1.81",
    "huggingface-hub>=1.30.0",
]

[project.scripts]
apholo8-egnn = "apholo8_egnn.cli.app:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
]
# The CUDA 13.0 build also runs on CPU-only machines.
[tool.uv.sources]
pyg-lib = { index = "pyg" }

[[tool.uv.index]]
name = "pyg"
url = "https://data.pyg.org/whl/torch-2.11.0+cu130.html"
format = "flat"
explicit = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "I"]

[tool.ruff.lint.per-file-ignores]
# torch_geometric inspector cannot handle types.UnionType (X | Y syntax)
"src/apholo8_egnn/model/vnegnn.py" = ["UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "torch_geometric.*",
    "esm.*",
    "Bio.*",
    "safetensors.*",
    "numpy",
    "numpy.*",
    "huggingface_hub",
    "huggingface_hub.*",
]
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src/apholo8_egnn"]
