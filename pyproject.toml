[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apholo-egnn"
version = "0.1.0"
description = "apholo-EGNN binding-site predictor, inference only"
requires-python = ">=3.12"

dependencies = [
    "torch-geometric==2.5.3",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "safetensors>=0.4.0",
    "fair-esm>=2.0.0",
    "biopython>=1.81",
    "huggingface-hub>=1.30.0",
]

[project.scripts]
apholo-egnn = "apholo_egnn.cli.app:main"

[project.optional-dependencies]
cpu = [
    "torch==2.11.*",
    "torch-cluster==1.6.3",
]

cu130 = [
    "torch==2.11.*",
    "torch-cluster==1.6.3",
]

dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu130" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]

torch-cluster = [
    { index = "pyg-cpu", extra = "cpu" },
    { index = "pyg-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pyg-cpu"
url = "https://data.pyg.org/whl/torch-2.11.0+cpu.html"
format = "flat"
explicit = true

[[tool.uv.index]]
name = "pyg-cu130"
url = "https://data.pyg.org/whl/torch-2.11.0+cu130.html"
format = "flat"
explicit = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "I"]

[tool.ruff.lint.per-file-ignores]
# torch_geometric inspector cannot handle types.UnionType (X | Y syntax)
"src/apholo_egnn/model/vnegnn.py" = ["UP007"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "torch_geometric.*",
    "esm.*",
    "Bio.*",
    "safetensors.*",
    "numpy",
    "numpy.*",
    "huggingface_hub",
    "huggingface_hub.*",
]
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src/apholo_egnn"]
